# =============================================================================
# Hermes Coder Profile — Distribution Definition
# =============================================================================
name: coder
version: "1.0.0"
description: "专业编程助手 - 代码编写、调试、重构、架构设计"
hermes_requires: "==0.19.0"

env_requires:
  node: "24.15.0"
  python: ">=3.12"

distribution_owned:
  - SOUL.md
  - config.yaml
  - skills/
  - .env.EXAMPLE

# Cron jobs are DECLARATIVE only in this distribution.
# This profile currently has no cron jobs defined.
cron_jobs: []

# Skills installed at this profile level
skills:
  - hermes
  - openclaw-mgmt
  - productivity

# Platforms configured (identifiers redacted)
platforms:
  - weixin
  - feishu
  - webhook

# -----------------------------------------------------------------------------
# Deployment notes:
# - config.yaml is SANITIZED (no API keys). Real keys in Release snapshot.
# - .env.EXAMPLE shows required env vars without real values.
# - This profile lives at ~/.hermes/profiles/coder/
# - Hermes gateway runs with: hermes --profile coder gateway run
# -----------------------------------------------------------------------------
